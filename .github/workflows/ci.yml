name: CI Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'benchmarks/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'benchmarks/**'

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src ruff check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest tests/ -v